name: Build Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: "Clone source"
      uses: actions/checkout@v4
    - name: "Setup msvc"
      uses: ilammy/msvc-dev-cmd@v1
    - name: "Download Qt5"
      shell: bash
      run: |
        curl --fail --output C:/qt5.7z -L "https://github.com/LoL-Fantome/lolcustomskin-tools/releases/download/release23/qt5.15.18-x86_64-msvc-static.7z"
        sha256sum C:/qt5.7z
        7z x -oC:/ C:/qt5.7z
    - name: "Build"
      run: |
        mkdir build
        cd build
        cmake -G "NMake Makefiles" "-DCMAKE_PREFIX_PATH:PATH=C:/qt5.15.18-x86_64-msvc-static" "-DCMAKE_MSVC_RUNTIME_LIBRARY:STRING=MultiThreaded" "-DCMAKE_BUILD_TYPE:STRING=Release" ..
        cmake --build .
    - name: "Package"
      shell: bash
      run: |
        ./make-release.sh build
        test -f lolsikins/LolSikins.exe
        test -f lolsikins/tools/mod-tools.exe
        test -f lolsikins/tools/diag.exe
        test -f lolsikins/licenses/LolSikins-source.zip
    # LolSikins does not ship the patcher. It uses the one from the user's own LTK Manager installation, which stays
    # the genuine signed release — the copy that attaches to the game reliably and that we are not allowed to
    # redistribute signed. So there is nothing to fetch or bundle here.
    #
    # Signs LolSikins.exe and the tools with our own certificate when the SIGNING_CERT (base64 .pfx) and
    # SIGNING_PASSWORD repository secrets exist. Without them the build stays unsigned.
    - name: "Sign"
      shell: pwsh
      env:
        SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      run: |
        if (-not $env:SIGNING_CERT) {
          Write-Host "::notice::No SIGNING_CERT secret, the package is not signed."
          exit 0
        }
        $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
        if (-not $signtool) {
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        }
        $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
        try {
          $files = @("lolsikins/LolSikins.exe") + (Get-ChildItem "lolsikins/tools/*.exe" | ForEach-Object FullName)
          & $signtool sign /f $pfx /p $env:SIGNING_PASSWORD /fd SHA256 @files
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
        } finally {
          Remove-Item $pfx -Force
        }
        foreach ($file in $files) {
          $subject = (Get-AuthenticodeSignature $file).SignerCertificate.Subject
          Write-Host "$file signed by $subject"
          if (-not $subject) { throw "$file is not signed" }
        }
    - name: "Upload Artifact"
      uses: actions/upload-artifact@v4
      with:
        name: lolsikins-windows
        path: lolsikins/
        retention-days: 30
    # Replaces the "latest" release with this build, so the download link stays the same.
    - name: "Publish release"
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        Compress-Archive -Path lolsikins/* -DestinationPath LolSikins-windows.zip
        $version = (Get-Content lolsikins/version.txt) -join ", "
        gh release delete latest --cleanup-tag --yes 2>$null
        $notes = @(
          "Build $env:GITHUB_RUN_NUMBER ($version)",
          "",
          "**Install [LTK Manager](https://github.com/LeagueToolkit/ltk-manager/releases) first.** LolSikins uses its patcher to apply skins.",
          "",
          "1. Download **LolSikins-windows.zip** below and extract the whole zip into a folder.",
          "2. Run **LolSikins.exe**. If Windows warns about an unknown publisher, choose *More info -> Run anyway*.",
          "3. Pick your League of Legends folder in the settings.",
          "4. Open the **Store**, install a skin, turn it on and press **START**, then join a match.",
          "",
          "Fan-made skins only. Riot's terms of service do not allow third-party programs that change game files; use it at your own risk.",
          "",
          "LolSikins isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games or anyone officially involved in producing or managing Riot Games properties. Riot Games, and all associated properties are trademarks or registered trademarks of Riot Games, Inc."
        )
        Set-Content -Encoding utf8 release-notes.md $notes
        gh release create latest LolSikins-windows.zip --target $env:GITHUB_SHA --title "LolSikins" --notes-file release-notes.md
        if ($LASTEXITCODE -ne 0) { throw "Could not publish the release" }
