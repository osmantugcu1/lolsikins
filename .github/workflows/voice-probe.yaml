name: Voice probe cleanup
# Temporary: removes the test data releases of the voice-language probe. Deleted right after it runs.
on:
  push:
    branches: [ claude/nice-knuth-wvxtyi ]
    paths: [ .github/workflows/voice-probe.yaml ]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: "Delete test data releases"
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for tag in voice-testdata voice-classify; do
          gh release delete "$tag" --cleanup-tag --yes || true
        done
        gh release list
