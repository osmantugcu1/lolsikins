name: Voice probe
# Temporary: gathers real data from Riot's CDN for developing the voice-language feature.
on:
  push:
    branches: [ claude/nice-knuth-wvxtyi ]
    paths: [ dev/voice_probe.py, .github/workflows/voice-probe.yaml ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: "Python packages"
      run: pip install zstandard xxhash
    - name: "Voice-over hash list"
      run: |
        mkdir -p out
        curl --fail -sSL "https://raw.communitydragon.org/data/hashes/lol/hashes.game.txt" | grep "/vo/" > out/vo-hashes.txt
        wc -l out/vo-hashes.txt
    - name: "Probe"
      run: python3 dev/voice_probe.py out out/vo-hashes.txt
    - name: "Publish test data"
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ls -la out
        gh release delete voice-testdata --cleanup-tag --yes || true
        gh release create voice-testdata out/* --prerelease --target "$GITHUB_SHA" --title "voice test data (temporary)" --notes "Temporary data for developing the voice-language feature. Safe to delete."
